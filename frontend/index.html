<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDO SKILLS - Интеллектуальная лента новостей</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📰 IDO SKILLS News</h1>
            <p class="subtitle">Интеллектуальная лента новостей с AI-фильтрацией</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('profile')">👤 Профиль</button>
            <button class="tab-btn" onclick="showTab('news')">📰 Новости</button>
            <button class="tab-btn" onclick="showTab('digest')">📋 Сводка</button>
            <button class="tab-btn" onclick="showTab('settings')">⚙️ Настройки</button>
        </div>

        <div id="profile" class="tab-content active">
            <h2>👤 Личный кабинет</h2>
            <div class="form-group">
                <label>Имя пользователя:</label>
                <input type="text" id="username" placeholder="Введите имя">
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="email" placeholder="Введите email">
            </div>
            <div class="form-group">
                <label>Интересы (через запятую):</label>
                <textarea id="interests" placeholder="технологии, AI, стартапы, программирование"></textarea>
            </div>
            <button onclick="registerUser()" class="btn-primary">Зарегистрироваться</button>
            <div id="user-info" class="hidden"></div>
        </div>

        <div id="news" class="tab-content">
            <h2>📰 Лента новостей</h2>
            <button onclick="fetchNews()" class="btn-primary">🔄 Обновить новости</button>
            <div id="news-list" class="news-list"></div>
        </div>

        <div id="digest" class="tab-content">
            <h2>📋 AI-Сводка</h2>
            <button onclick="getDigest()" class="btn-primary">🤖 Сгенерировать сводку</button>
            <div id="digest-content" class="digest-content"></div>
        </div>

        <div id="settings" class="tab-content">
            <h2>⚙️ Настройки</h2>
            <div class="form-group">
                <label>Порог важности (1-10):</label>
                <input type="range" id="threshold" min="1" max="10" value="6">
                <span id="threshold-value">6</span>
            </div>
            <button onclick="saveSettings()" class="btn-primary">Сохранить</button>
        </div>

        <footer>
            <p>IDO SKILLS 2026 | Версия 1.0.0</p>
            <p id="status" class="status"></p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
